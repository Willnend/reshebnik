<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- «Тетрадь»: бумажный фон, чернильная книга, киноварная отметка -->
  </defs>

  <!-- Фон — тёплая бумага со скруглением -->
  <rect width="512" height="512" rx="115" fill="#F5F0E6"/>

  <!-- Лёгкая тень под книгой -->
  <ellipse cx="256" cy="388" rx="150" ry="16" fill="#1C2433" opacity="0.07"/>

  <!-- Открытая книга: чернильный контур, бумажные страницы -->
  <path d="M104 372 C168 336 230 346 256 362 C282 346 344 336 408 372 L408 158 C344 122 282 132 256 148 C230 132 168 122 104 158 Z"
        fill="#FDFBF5" stroke="#1C2433" stroke-width="14" stroke-linejoin="round"/>

  <!-- Переплёт -->
  <path d="M256 150 L256 360" stroke="#1C2433" stroke-width="10" stroke-linecap="round"/>

  <!-- Строки левой страницы -->
  <line x1="138" y1="200" x2="222" y2="190" stroke="#1C2433" stroke-width="11" stroke-linecap="round" opacity="0.82"/>
  <line x1="138" y1="238" x2="222" y2="228" stroke="#1C2433" stroke-width="11" stroke-linecap="round" opacity="0.82"/>
  <line x1="138" y1="276" x2="206" y2="266" stroke="#1C2433" stroke-width="11" stroke-linecap="round" opacity="0.82"/>

  <!-- Строки правой страницы -->
  <line x1="290" y1="190" x2="374" y2="200" stroke="#1C2433" stroke-width="11" stroke-linecap="round" opacity="0.82"/>
  <line x1="290" y1="228" x2="374" y2="238" stroke="#1C2433" stroke-width="11" stroke-linecap="round" opacity="0.82"/>
  <line x1="290" y1="266" x2="352" y2="276" stroke="#1C2433" stroke-width="11" stroke-linecap="round" opacity="0.82"/>

  <!-- Киноварная отметка «проверено ручкой» на правой странице -->
  <path d="M296 306 C316 296 344 298 360 306" stroke="#A64826" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Значок «1 класс» — киноварный круг -->
  <circle cx="399" cy="118" r="52" fill="#A64826"/>
  <circle cx="399" cy="118" r="52" fill="none" stroke="#F5F0E6" stroke-width="10"/>
  <text x="399" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#FDFBF5" text-anchor="middle">1</text>
</svg>
