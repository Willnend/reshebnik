<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Решебник для Учителя: Начальная школа (1–4 классы)</title>
  
  <!-- PWA & iOS мета-теги -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#F5F0E6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Решебник 1-4кл">
  <link rel="apple-touch-icon" href="./icons/icon-512.png">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg?v=2">

  <link rel="stylesheet" href="./fonts/fonts.css?v=primary-4.0">
  <link rel="stylesheet" href="./css/style.css?v=primary-4.0">
</head>
<body class="font-md">

  <!-- SVG-СПРАЙТ ИКОНОК (единый стиль вместо эмодзи) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.7 5.1c.43-.06.86-.1 1.3-.1 6.5 0 10 7 10 7a13.4 13.4 0 0 1-1.7 2.4M6.6 6.6A13.5 13.5 0 0 0 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.9-.9"/><circle cx="12" cy="12" r="3"/><line x1="4" y1="4" x2="20" y2="20"/>
    </symbol>
    <symbol id="i-type" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 7 4 4 20 4 20 7"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="9" y1="20" x2="15" y2="20"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
    </symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
    </symbol>
    <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 18-6-6 6-6"/>
    </symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 18 6-6-6-6"/>
    </symbol>
    <symbol id="i-chevron-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 15 6-6 6 6"/>
    </symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
    <symbol id="i-minimize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/>
    </symbol>
  </svg>

  <!-- ВЕРХНЯЯ ШАПКА -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand" onclick="window.scrollTo({top:0, behavior:'smooth'})">
        <img src="./icons/icon.svg?v=2" alt="Лого" class="brand-icon">
        <span class="brand-title">
          Решебник для Учителя
          <span class="brand-badge">1–4 классы</span>
        </span>
      </div>

      <div class="teacher-toolbar">
        <button id="toggleAnswersBtn" class="tool-btn toggle-answers-btn active" title="Скрыть или показать ответы на уроке (Пробел)">
          <span class="tool-btn-icon"><svg class="icon" aria-hidden="true"><use href="#i-eye-off"></use></svg></span>
          <span class="tool-btn-text"><span class="tool-label-action">Скрыть</span><span class="tool-label-extra"> ответы</span></span>
        </button>
        <button id="fontSizeBtn" class="tool-btn" title="Изменить размер текста для проектора">
          <span class="tool-btn-icon"><svg class="icon" aria-hidden="true"><use href="#i-type"></use></svg></span>
          <span class="tool-btn-text"><span class="tool-label-extra">Шрифт </span><span class="font-badge">125%</span></span>
        </button>
        <button id="themeToggleBtn" class="tool-btn theme-toggle-btn" title="Переключить тему (Светлая / Тёмная)">
          <span class="theme-icon tool-btn-icon"><svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg></span>
          <span class="theme-label tool-btn-text">Тёмная</span>
        </button>
        <button id="fullscreenBtn" class="tool-btn fullscreen-btn" title="Полноэкранный режим для проектора (F11)">
          <span class="fs-icon tool-btn-icon"><svg class="icon" aria-hidden="true"><use href="#i-maximize"></use></svg></span>
          <span class="fs-label tool-btn-text">Экран</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ВЫБОР КЛАССА (1 - 4 КЛАССЫ НАЧАЛЬНОЙ ШКОЛЫ) -->
  <div class="grade-nav-wrap">
    <div class="grade-nav-inner">
    <div class="grade-nav" id="gradeNav">
      <span class="grade-nav-label">Класс:</span>
      <button class="grade-tab active" data-grade="1">1 класс</button>
      <button class="grade-tab" data-grade="2">2 класс</button>
      <button class="grade-tab" data-grade="3">3 класс</button>
      <button class="grade-tab" data-grade="4">4 класс</button>
    </div>
    <div class="grade-nav-pin" id="premiumChipSlot"></div>
    </div>
  </div>

  <!-- НАВИГАЦИЯ ПО УЧЕБНИКАМ ВЫБРАННОГО КЛАССА -->
  <div class="books-nav-wrap">
    <nav class="books-nav" id="booksNav">
      <!-- Заполняется динамически из каталога -->
    </nav>
  </div>

  <!-- ПАНЕЛЬ ВЫБОРА СТРАНИЦЫ И ПОИСКА -->
  <div class="page-nav-bar">
    <div class="page-nav-container">
      <!-- Выбор части (1 / 2) -->
      <div class="parts-selector" id="partsSelector">
        <button class="part-btn active" data-part="1">Часть 1</button>
        <button class="part-btn" data-part="2">Часть 2</button>
      </div>

      <!-- Контролы страницы -->
      <div class="page-controls">
        <button id="prevPageBtn" class="nav-arrow-btn" title="Предыдущая страница (←)">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
        </button>

        <div class="page-display-box">
          <span class="page-label">Стр.</span>
          <input type="number" id="pageInput" class="page-number-input" value="4" min="1" max="200" inputmode="numeric" enterkeyhint="go" aria-label="Номер страницы">
          <span class="page-stepper">
            <button id="pageStepUp" class="stepper-btn" type="button" title="Страница вперёд" aria-label="Страница вперёд">
              <svg class="icon" aria-hidden="true"><use href="#i-chevron-up"></use></svg>
            </button>
            <button id="pageStepDown" class="stepper-btn" type="button" title="Страница назад" aria-label="Страница назад">
              <svg class="icon" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
            </button>
          </span>
          <span id="pageTotalLabel" class="page-total-label">/ 127</span>
        </div>

        <button id="openNumpadBtn" class="nav-arrow-btn numpad-btn" type="button" title="Ввести номер страницы на панели" aria-label="Ввести номер страницы на панели">
          <svg class="icon" aria-hidden="true"><use href="#i-grid"></use></svg>
        </button>

        <button id="nextPageBtn" class="nav-arrow-btn" title="Следующая страница (→)">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
        </button>
      </div>

      <!-- Поле прямого поиска по теме или номеру страницы (без отдельного всплывающего окна) -->
      <div class="search-box-inline">
        <span class="search-icon"><svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg></span>
        <input type="text" id="inlineSearchInput" class="inline-search-input" placeholder="Поиск темы (напр. Гласные) или страницы..." autocomplete="off">
        <button id="clearSearchBtn" class="clear-search-btn" title="Очистить" style="display:none;">&times;</button>
        <!-- Выпадающие результаты поиска прямо под строкой -->
        <div id="inlineSearchResults" class="inline-search-results" style="display:none;"></div>
      </div>
    </div>
  </div>

  <!-- ОСНОВНОЙ КОНТЕНТ УЧЕБНИКА -->
  <main class="main-content">
    <article class="page-card">
      <div class="page-header-info">
        <div>
          <div id="pageMetaTitle" class="book-meta-title">Математика 1 класс • Часть 1</div>
          <h1 id="pageHeading" class="page-main-heading">Страница 4</h1>
          <div id="pageTopics" style="display:none;"></div>
        </div>

        <!-- Переключатель года издания учебника (2020 / 2023) -->
        <div id="editionSwitchBox" class="edition-switch-box" style="display:none;">
          <span class="edition-label">Год издания:</span>
          <div class="edition-btns">
            <button class="edition-btn active" data-year="2023">2023</button>
            <button class="edition-btn" data-year="2020">2020</button>
          </div>
        </div>
      </div>

      <!-- Текст заданий и решений -->
      <div id="pageContent" class="exercise-content">
        <div class="page-skeleton" aria-hidden="true">
          <div class="sk-line w40"></div>
          <div class="sk-line w85"></div>
          <div class="sk-line" style="width:100%"></div>
          <div class="sk-block"></div>
          <div class="sk-line w85"></div>
          <div class="sk-line w60"></div>
        </div>
      </div>
    </article>
  </main>

  <!-- СЕНСОРНАЯ КЛАВИАТУРА NUMPAD ДЛЯ IPAD / IPHONE -->
  <div id="numpadModal" class="numpad-modal">
    <div class="numpad-card">
      <div class="numpad-header">
        <div class="numpad-title">Переход к странице</div>
        <button id="numpadCloseBtn" class="search-close-btn">&times;</button>
      </div>

      <div id="numpadDisplay" class="numpad-display">—</div>

      <div class="numpad-grid">
        <button class="num-key" data-digit="1">1</button>
        <button class="num-key" data-digit="2">2</button>
        <button class="num-key" data-digit="3">3</button>
        <button class="num-key" data-digit="4">4</button>
        <button class="num-key" data-digit="5">5</button>
        <button class="num-key" data-digit="6">6</button>
        <button class="num-key" data-digit="7">7</button>
        <button class="num-key" data-digit="8">8</button>
        <button class="num-key" data-digit="9">9</button>
        <button class="num-key clear-key" data-action="clear">C</button>
        <button class="num-key" data-digit="0">0</button>
        <button class="num-key enter-key" data-action="enter">Перейти</button>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX ДЛЯ УВЕЛИЧЕНИЯ КАРТИНОК -->
  <div id="lightboxModal" class="lightbox-modal">
    <button id="lightboxClose" class="lightbox-close">&times;</button>
    <img id="lightboxImg" class="lightbox-img" src="" alt="Увеличенное изображение">
  </div>

  <script src="./js/storage.js?v=primary-4.0"></script>
  <script src="./js/app.js?v=primary-4.0"></script>
  <script src="./js/billing.js?v=primary-4.0"></script>
</body>
</html>
